name: truthful-attribution-gate
# Thin caller for the organization's reusable truthful-attribution-gate. The
# engine is pinned twice, in the uses: line and in the ref: input, and both
# name the same commit of the shared engine, one the organization's merge
# machinery accepts. The comment on the uses: line is a build marker of that
# commit for the pinned-action gate, not a release tag. A maintained rollout
# tool moves both pins together with this repository's check suite.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is required by the re-pinned reusable engine: it resolves a
  # reusable-workflow check-run to its Actions run (GET /actions/runs/{id}) to
  # verify referenced_workflows[] at the pinned SHA. A called reusable workflow's
  # permissions cannot EXCEED the caller's grant, so the caller must grant
  # actions:read or the run fails to start (startup_failure), which WARN mode
  # cannot rescue (it fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@1e40675e1642dcc32d195f27b3deb285b4d3d6fc # v0+engine.1e40675e.grant.2
    with:
      mode: warn
      ref: 1e40675e1642dcc32d195f27b3deb285b4d3d6fc # engine 1e40675e, grant revision 2
